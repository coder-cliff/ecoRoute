<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="manifest" href="manifest.json">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #72B08D;
      font-family: 'Satoshi', sans-serif;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #72B08D;
      z-index: 1000;
      pointer-events: none;
    }
    .splash-emblem {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid #0D2618;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .splash-title {
      font-family: 'Satoshi', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #0D2618;
      letter-spacing: -0.4px;
      margin: 0;
    }
    .splash-sub {
      font-family: 'Satoshi', sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      color: #1A3A28;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-emblem">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0D2618" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
      </svg>

    <h1 class="splash-title">EcoRoute</h1>
    <div class="splash-sub">Sustainable Waste Logistics &bull; Arua</div>
  </div>
