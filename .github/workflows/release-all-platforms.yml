name: Build Cross-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v1.0.1)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Split & Universal APK
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios-ipa:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS App
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          tar -czvf ../../../ecoroute-ios.ipa Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-iOS-Unsigned-IPA
          path: ecoroute-ios.ipa

  build-linux-desktop:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Linux Desktop Bundle
        run: |
          flutter pub get
          flutter build linux --release
          tar -czvf ecoroute-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-Linux-Desktop-Bundle
          path: ecoroute-linux-x64.tar.gz

  build-windows-desktop:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows Desktop Bundle
        run: |
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ecoroute-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-Windows-Desktop-Bundle
          path: ecoroute-windows-x64.zip

  publish-github-release:
    name: Publish Official GitHub Release
    needs: [build-android-apk, build-ios-ipa, build-linux-desktop, build-windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets with Dynamic Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v1.0.0"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          mkdir -p final-assets
          cp release-artifacts/EcoRoute-Android-Release-APK/app-release.apk "final-assets/EcoRoute-${TAG}.apk"
          cp release-artifacts/EcoRoute-iOS-Unsigned-IPA/ecoroute-ios.ipa "final-assets/EcoRoute-${TAG}-iOS-Unsigned.ipa"
          cp release-artifacts/EcoRoute-Linux-Desktop-Bundle/ecoroute-linux-x64.tar.gz "final-assets/EcoRoute-${TAG}-Linux-x64.tar.gz"
          cp release-artifacts/EcoRoute-Windows-Desktop-Bundle/ecoroute-windows-x64.zip "final-assets/EcoRoute-${TAG}-Windows-x64.zip"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "EcoRoute Production Release ${{ steps.vars.outputs.tag }}"
          files: final-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
