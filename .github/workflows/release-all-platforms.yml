name: Build Cross-Platform Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios-ipa:
    name: Build iOS IPA (Free Unsigned / Sideloadable)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App Bundle
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r EcoRoute-iOS-Unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-iOS-Unsigned-IPA
          path: EcoRoute-iOS-Unsigned.ipa

  build-linux-desktop:
    name: Build Linux Desktop Executable
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Desktop Bundle
        run: tar -czvf ecoroute-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-Linux-Desktop-Bundle
          path: ecoroute-linux-x64.tar.gz

  build-windows-desktop:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ecoroute-windows-x64.zip

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: EcoRoute-Windows-Desktop-Bundle
          path: ecoroute-windows-x64.zip

  publish-github-release:
    name: Publish Official GitHub Release
    needs: [build-android-apk, build-ios-ipa, build-linux-desktop, build-windows-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p final-assets
          cp release-artifacts/EcoRoute-Android-Release-APK/app-release.apk final-assets/EcoRoute-v1.0.0.apk
          cp release-artifacts/EcoRoute-iOS-Unsigned-IPA/EcoRoute-iOS-Unsigned.ipa final-assets/EcoRoute-v1.0.0-iOS-Unsigned.ipa
          cp release-artifacts/EcoRoute-Linux-Desktop-Bundle/ecoroute-linux-x64.tar.gz final-assets/EcoRoute-v1.0.0-Linux-x64.tar.gz
          cp release-artifacts/EcoRoute-Windows-Desktop-Bundle/ecoroute-windows-x64.zip final-assets/EcoRoute-v1.0.0-Windows-x64.zip
          ls -la final-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "EcoRoute Production Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          body: |
            ## 🌿 EcoRoute Official Release
            **Smart Municipal Logistics & Waste Collection Platform**

            ### 📱 Download Installers:
            - **Android APK**: [EcoRoute-v1.0.0.apk](EcoRoute-v1.0.0.apk) (Universal Android release, all architectures)
            - **Windows**: [EcoRoute-v1.0.0-Windows-x64.zip](EcoRoute-v1.0.0-Windows-x64.zip)
            - **Linux**: [EcoRoute-v1.0.0-Linux-x64.tar.gz](EcoRoute-v1.0.0-Linux-x64.tar.gz)
            - **iOS**: [EcoRoute-v1.0.0-iOS-Unsigned.ipa](EcoRoute-v1.0.0-iOS-Unsigned.ipa) (Sideloadable via AltStore / SideStore)

            ### ✨ Key Features:
            - **Real-Time Reactive Dispatch**: Dynamic assignment between Residents, Riders, and Admins.
            - **Strict Role Separation**: Enforced security profiles without manual role switching.
            - **Verification & Settlement**: Real-time 4-digit PIN verification and automatic municipal earnings credit.
            - **Direct Hotline**: Dedicated emergency support (+256394880352).
          draft: false
          prerelease: false
          files: |
            final-assets/*

